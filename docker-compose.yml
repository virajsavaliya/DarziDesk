
services:
  postgres:
    image: postgres:16-alpine
    container_name: darzi_desk_postgres
    restart: always
    environment:
      POSTGRES_USER: darzi
      POSTGRES_PASSWORD: darzi_secret
      POSTGRES_DB: darzi_desk_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darzi -d darzi_desk_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: darzi_desk_openwa
    restart: unless-stopped
    ports:
      - '2785:2785'
    environment:
      - PORT=2785
      - NODE_ENV=development
      - API_MASTER_KEY=darzi_desk_whatsapp_secret_key_prod_2026_super_secure
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - AUTO_START_SESSIONS=true
    volumes:
      - openwa_data:/app/data

volumes:
  postgres_data:
  openwa_data:

