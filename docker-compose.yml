version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: darzi_desk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darzi
      POSTGRES_PASSWORD: darzi_secret
      POSTGRES_DB: darzi_desk_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darzi -d darzi_desk_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
